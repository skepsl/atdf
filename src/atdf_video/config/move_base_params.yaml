# This file configures the "recovery behaviors" for move_base
# You must load this file in your move_base launch file.
#
# By default, the list includes 'rotate_recovery'.
# This version removes it to prevent the "dangerous" rotation.
# Set the command loop rate here, not under TebLocalPlannerROS.
# 20 Hz is move_base's default and gives feedback every 5 cm at 1 m/s.
controller_frequency: 20.0
make_plan_add_unreachable_goal: false
make_plan_max_iterations: -1
planner_patience: 5.0
make_plan_service: true
recovery_behaviors:
  - name: 'conservative_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'aggressive_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'

# --- DEFAULT (FOR REFERENCE) ---
# This is what the default list usually looks like.
# By creating the list above, we are overwriting this.
#
